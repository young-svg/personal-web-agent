[project]
name = "personal-web-agent"
version = "0.1.0"
description = "Local browser agent with human handoff and persistent task records"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "browser-use==0.13.14",
    "python-dotenv==1.2.2",
    "httpx==0.28.1",
    "Pillow==12.3.0",
    "pypdf==6.16.2",
]

[dependency-groups]
fixture = [
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
]

[project.scripts]
personal-web-agent = "personal_web_agent.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/personal_web_agent"]
